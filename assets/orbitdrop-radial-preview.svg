<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <!-- Background Desktop Wallpaper -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glass Window Gradient -->
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Active Sector Gradient -->
    <linearGradient id="activeSectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Center Puck Gradient -->
    <radialGradient id="puckGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </radialGradient>

    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="wheelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00F2FE" flood-opacity="0.8"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Desktop Wallpaper -->
  <rect width="1200" height="700" fill="url(#deskGrad)"/>
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="180" fill="#00F2FE" fill-opacity="0.08" filter="url(#activeGlow)"/>
  <circle cx="1020" cy="520" r="220" fill="#818CF8" fill-opacity="0.07" filter="url(#activeGlow)"/>

  <!-- macOS Top Menu Bar -->
  <rect width="1200" height="30" fill="#0B1329" fill-opacity="0.85"/>
  <line x1="0" y1="30" x2="1200" y2="30" stroke="#1E293B" stroke-width="1"/>
  <text x="22" y="20" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF"></text>
  <text x="44" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Finder</text>
  <text x="100" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Arquivo</text>
  <text x="160" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Editar</text>
  <text x="210" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Visualizar</text>
  <text x="285" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Ir</text>
  <text x="310" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Janela</text>
  <text x="365" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Ajuda</text>
  
  <text x="1110" y="20" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0">100%</text>
  <text x="1035" y="20" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0">Qui 21:18</text>

  <!-- Background Finder Window -->
  <g transform="translate(140, 70)" filter="url(#winShadow)">
    <rect width="920" height="560" rx="14" fill="url(#winGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <rect width="920" height="52" rx="14" fill="#1E293B" fill-opacity="0.95"/>
    <circle cx="24" cy="26" r="6.5" fill="#EF4444"/>
    <circle cx="44" cy="26" r="6.5" fill="#F59E0B"/>
    <circle cx="64" cy="26" r="6.5" fill="#10B981"/>
    
    <text x="460" y="31" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Fotos para Conversão — 12 itens</text>
    <line x1="0" y1="52" x2="920" y2="52" stroke="#334155" stroke-width="1"/>

    <!-- Sidebar -->
    <rect y="52" width="180" height="508" fill="#0B132B" fill-opacity="0.5"/>
    <line x1="180" y1="52" x2="180" y2="560" stroke="#334155" stroke-width="1"/>
    <text x="24" y="85" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748B">FAVORITOS</text>
    
    <!-- Clean sidebar items with colored icon badges -->
    <g transform="translate(24, 102)">
      <rect width="18" height="18" rx="4" fill="#0284C7"/>
      <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#38BDF8">Fotos do Projeto</text>
    </g>
    <g transform="translate(24, 132)">
      <rect width="18" height="18" rx="4" fill="#475569"/>
      <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Documentos</text>
    </g>
    <g transform="translate(24, 162)">
      <rect width="18" height="18" rx="4" fill="#475569"/>
      <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Downloads</text>
    </g>
    <g transform="translate(24, 192)">
      <rect width="18" height="18" rx="4" fill="#475569"/>
      <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Aplicativos</text>
    </g>

    <!-- File Grid Items in Finder -->
    <!-- File 1: DSC_1001.RAW -->
    <g transform="translate(220, 90)">
      <rect width="76" height="92" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <rect x="12" y="14" width="52" height="42" rx="6" fill="#0369A1" fill-opacity="0.5"/>
      <text x="38" y="40" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">HEIC</text>
      <text x="38" y="78" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1" text-anchor="middle">foto_01.heic</text>
    </g>
    <!-- File 2: DSC_1002.RAW -->
    <g transform="translate(330, 90)">
      <rect width="76" height="92" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <rect x="12" y="14" width="52" height="42" rx="6" fill="#4338CA" fill-opacity="0.5"/>
      <text x="38" y="40" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">PNG</text>
      <text x="38" y="78" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1" text-anchor="middle">foto_02.png</text>
    </g>
  </g>

  <!-- THE RADIAL WHEEL MENU (Active HUD under cursor) -->
  <g id="wheel-hud" filter="url(#wheelShadow)">
    <!-- Outer Glass Ring Background -->
    <circle cx="600" cy="360" r="196" fill="#070C18" fill-opacity="0.95" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="600" cy="360" r="190" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- The 6 Sectors -->
    <path d="M 608.46 166.18 A 194 194 0 0 1 763.62 255.76 L 645.54 330.99 A 54 54 0 0 0 602.36 306.05 Z" fill="url(#activeSectorGrad)" fill-opacity="0.96" stroke="#00F2FE" stroke-width="2.5" filter="url(#activeGlow)"/>
<path d="M 759.66 276.89 A 180 180 0 0 1 759.66 443.11 L 647.90 384.93 A 54 54 0 0 0 647.90 335.07 Z" fill="#162032" fill-opacity="0.85" stroke="#334155" stroke-width="1.0" />
<path d="M 751.81 456.71 A 180 180 0 0 1 607.85 539.83 L 602.36 413.95 A 54 54 0 0 0 645.54 389.01 Z" fill="#162032" fill-opacity="0.85" stroke="#334155" stroke-width="1.0" />
<path d="M 592.15 539.83 A 180 180 0 0 1 448.19 456.71 L 554.46 389.01 A 54 54 0 0 0 597.64 413.95 Z" fill="#162032" fill-opacity="0.85" stroke="#334155" stroke-width="1.0" />
<path d="M 440.34 443.11 A 180 180 0 0 1 440.34 276.89 L 552.10 335.07 A 54 54 0 0 0 552.10 384.93 Z" fill="#162032" fill-opacity="0.85" stroke="#334155" stroke-width="1.0" />
<path d="M 448.19 263.29 A 180 180 0 0 1 592.15 180.17 L 597.64 306.05 A 54 54 0 0 0 554.46 330.99 Z" fill="#162032" fill-opacity="0.85" stroke="#334155" stroke-width="1.0" />
    
      <text x="662.0" y="257.6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">WEBP</text>
    

      <text x="717.0" y="365.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="0.5">PNG</text>
    

      <text x="658.5" y="466.3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="0.5">JPEG</text>
    

      <text x="541.5" y="466.3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="0.5">PDF</text>
    

      <text x="483.0" y="365.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="0.5">AVIF</text>
    

      <text x="541.5" y="263.7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="0.5">TIFF</text>
    

    <!-- Center Puck -->
    <circle cx="600" cy="360" r="54" fill="url(#puckGrad)" stroke="#00F2FE" stroke-width="2.5" filter="url(#activeGlow)"/>
    <circle cx="600" cy="360" r="51" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.4"/>
    
    <!-- Key Modifier Badge in Center -->
    <rect x="570" y="336" width="60" height="22" rx="6" fill="#0C4A6E" stroke="#00F2FE" stroke-width="1"/>
    <text x="600" y="351" font-family="-apple-system, monospace" font-size="13" font-weight="800" fill="#00F2FE" text-anchor="middle">⇧ Shift</text>
    <text x="600" y="373" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Conversão</text>
    <text x="600" y="386" font-family="-apple-system, sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">12 arquivos</text>
  </g>

  <!-- Dragged Files Badge (Positioned clearly beside cursor) -->
  <g transform="translate(730, 260)" filter="url(#cardShadow)">
    <rect width="180" height="42" rx="10" fill="#0F172A" fill-opacity="0.96" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="10" y="10" width="28" height="22" rx="4" fill="#0369A1"/>
    <text x="24" y="25" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">IMG</text>
    <text x="46" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">banner.png + 2</text>
    <!-- Badge counter -->
    <circle cx="162" cy="21" r="10" fill="#0284C7"/>
    <text x="162" y="25" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <!-- Pointer Arrow Hovering on WEBP Sector -->
  <g transform="translate(635, 290)">
    <polygon points="0,0 0,20 5,16 11,26 15,24 9,14 16,14" fill="#00F2FE" stroke="#0A0F1D" stroke-width="2"/>
  </g>

  <!-- Bottom Notification Pill (HUD Toast) -->
  <g transform="translate(420, 625)" filter="url(#cardShadow)">
    <rect width="360" height="42" rx="21" fill="#0F172A" fill-opacity="0.96" stroke="#00F2FE" stroke-width="1.5"/>
    <circle cx="26" cy="21" r="7" fill="#00F2FE" filter="url(#activeGlow)"/>
    <text x="44" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">
      Solte no setor para converter em WebP
    </text>
  </g>
</svg>